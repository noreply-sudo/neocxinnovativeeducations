<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>March 2026 Content Planner Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Smooth fade for modal */
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
        
        /* Custom scrollbar */
        .day-content::-webkit-scrollbar { width: 4px; }
        .day-content::-webkit-scrollbar-track { background: transparent; }
        .day-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* Icon animations */
        .add-btn { opacity: 0; transition: opacity 0.2s; }
        .day-cell:hover .add-btn { opacity: 1; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-32">

    <div class="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-[95%] mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">March 2026</h1>
                <p class="text-sm text-slate-500">Interactive Planning Tool</p>
            </div>
            <div class="flex gap-2">
                <button onclick="clearAllData()" class="text-xs text-red-500 hover:text-red-700 font-medium underline px-3">Clear Calendar</button>
            </div>
        </div>
    </div>

    <div class="max-w-[95%] mx-auto mt-6" id="calendar-container">
        </div>

    <div class="fixed bottom-6 right-6 left-6 md:left-auto md:w-96 z-50">
        <button onclick="informMinoshSir()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-2xl transform transition hover:-translate-y-1 flex items-center justify-center gap-3">
            <i class="fas fa-paper-plane"></i>
            INFORM MINOSH SIR
        </button>
    </div>

    <div id="entryModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto">
            
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3 border-b border-gray-100">
                    <p class="text-xl font-bold text-gray-800" id="modalDateTitle">Add Content</p>
                    <div class="modal-close cursor-pointer z-50" onclick="toggleModal()">
                        <i class="fas fa-times text-gray-500 hover:text-red-500"></i>
                    </div>
                </div>

                <div class="my-5 space-y-4">
                    <input type="hidden" id="selectedDate">
                    
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Content Type</label>
                        <select id="contentType" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Poster">Poster</option>
                            <option value="Video">Video / Content</option>
                            <option value="Reel">Reel / Shorts</option>
                            <option value="Troll">Troll Video</option>
                            <option value="Ad">Ad Video</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Title / Description</label>
                        <input type="text" id="contentTitle" placeholder="e.g. World Kidney Day, EziNurse Ad..." class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Posting Time</label>
                        <input type="time" id="contentTime" value="17:30" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Platforms</label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 cursor-pointer p-2 border rounded hover:bg-red-50 border-red-200">
                                <input type="checkbox" id="platYT" checked class="accent-red-600">
                                <i class="fab fa-youtube text-red-600"></i> <span class="text-xs font-semibold">YT</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer p-2 border rounded hover:bg-blue-50 border-blue-200">
                                <input type="checkbox" id="platFB" checked class="accent-blue-600">
                                <i class="fab fa-facebook text-blue-600"></i> <span class="text-xs font-semibold">FB</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer p-2 border rounded hover:bg-pink-50 border-pink-200">
                                <input type="checkbox" id="platIG" checked class="accent-pink-600">
                                <i class="fab fa-instagram text-pink-600"></i> <span class="text-xs font-semibold">IG</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end pt-2 gap-2">
                    <button onclick="toggleModal()" class="px-4 py-2 bg-gray-100 p-3 rounded-lg text-gray-600 hover:bg-gray-200 font-medium">Cancel</button>
                    <button onclick="saveContent()" class="px-4 py-2 bg-indigo-600 rounded-lg text-white hover:bg-indigo-700 font-bold shadow-lg">Add to Calendar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Calendar Logic
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        // March 2026 starts on Sunday (index 0) and has 31 days
        const startDayIndex = 0; 
        const totalDays = 31;
        
        let events = JSON.parse(localStorage.getItem('march2026_events')) || {};

        function initCalendar() {
            const container = document.getElementById('calendar-container');
            let html = '';
            
            // Header for Days
            html += `<div class="grid grid-cols-7 gap-4 mb-2">
                ${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => `<div class="text-center text-xs font-bold text-gray-400">${d}</div>`).join('')}
            </div>`;

            let currentDay = 1;
            let weekCount = 1;

            html += `<div class="grid grid-cols-1 md:grid-cols-7 gap-4 auto-rows-fr">`;

            // Empty cells before start of month
            for(let i=0; i<startDayIndex; i++) {
                html += `<div class="hidden md:block"></div>`;
            }

            // Days
            for (let i = 1; i <= totalDays; i++) {
                // Check if we need to close a row and add week label (Logic simplified for grid flow)
                // For this grid layout, we just dump the cards. We can add visual week breaks if needed, 
                // but a continuous grid is cleaner for data entry.
                
                const dayEvents = events[i] || [];
                const isToday = false; // logic for real time if needed

                html += `
                <div class="day-cell group bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col min-h-[160px] relative transition hover:shadow-md hover:border-indigo-300 cursor-pointer" onclick="openModal(${i})">
                    <div class="p-3 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                        <span class="font-bold text-gray-700">${i} Mar</span>
                        <button class="add-btn text-indigo-600 bg-white rounded-full w-6 h-6 flex items-center justify-center shadow-sm hover:bg-indigo-600 hover:text-white transition"><i class="fas fa-plus text-xs"></i></button>
                    </div>
                    <div class="p-2 space-y-1 day-content overflow-y-auto max-h-[200px]">
                        ${dayEvents.map((evt, idx) => renderEventHTML(evt, i, idx)).join('')}
                    </div>
                </div>`;
            }
            
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderEventHTML(evt, day, idx) {
            let icons = '';
            if(evt.platforms.includes('YT')) icons += '<i class="fab fa-youtube text-red-500 text-[10px]"></i> ';
            if(evt.platforms.includes('FB')) icons += '<i class="fab fa-facebook text-blue-500 text-[10px]"></i> ';
            if(evt.platforms.includes('IG')) icons += '<i class="fab fa-instagram text-pink-500 text-[10px]"></i> ';

            // Color coding based on type
            let bgClass = 'bg-gray-100';
            let borderClass = 'border-gray-300';
            if(evt.type === 'Poster') { bgClass = 'bg-blue-50'; borderClass='border-blue-200'; }
            if(evt.type === 'Video') { bgClass = 'bg-red-50'; borderClass='border-red-200'; }
            if(evt.type === 'Reel') { bgClass = 'bg-pink-50'; borderClass='border-pink-200'; }
            if(evt.type === 'Ad') { bgClass = 'bg-yellow-50'; borderClass='border-yellow-200'; }

            return `
            <div class="text-xs p-2 rounded border ${bgClass} ${borderClass} mb-1 relative group/item" onclick="event.stopPropagation(); deleteEvent(${day}, ${idx})">
                <div class="flex justify-between items-start">
                    <span class="font-bold text-gray-700 uppercase text-[10px]">${evt.type}</span>
                    <span class="text-[10px] text-gray-500">${evt.time}</span>
                </div>
                <div class="font-medium text-gray-800 leading-tight my-1">${evt.title}</div>
                <div class="flex justify-between items-center mt-1">
                    <div class="flex gap-1">${icons}</div>
                    <i class="fas fa-trash text-gray-300 hover:text-red-500 opacity-0 group-hover/item:opacity-100 transition"></i>
                </div>
            </div>`;
        }

        // Modal Functions
        function openModal(day) {
            document.getElementById('selectedDate').value = day;
            document.getElementById('modalDateTitle').innerText = `Add Content for March ${day}`;
            document.getElementById('contentTitle').value = '';
            // keep previous time or default
            toggleModal();
            document.getElementById('contentTitle').focus();
        }

        function toggleModal() {
            const body = document.querySelector('body');
            const modal = document.querySelector('.modal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            body.classList.toggle('modal-active');
        }

        // Save Data
        function saveContent() {
            const day = document.getElementById('selectedDate').value;
            const type = document.getElementById('contentType').value;
            const title = document.getElementById('contentTitle').value;
            const time = document.getElementById('contentTime').value;
            
            // Get platforms
            let platforms = [];
            if(document.getElementById('platYT').checked) platforms.push('YT');
            if(document.getElementById('platFB').checked) platforms.push('FB');
            if(document.getElementById('platIG').checked) platforms.push('IG');

            if(!title) { alert("Please enter a title"); return; }
            if(platforms.length === 0) { alert("Please select at least one platform"); return; }

            if(!events[day]) events[day] = [];
            
            events[day].push({ type, title, time, platforms });
            
            // Sort by time
            events[day].sort((a, b) => a.time.localeCompare(b.time));

            localStorage.setItem('march2026_events', JSON.stringify(events));
            
            toggleModal();
            initCalendar();
        }

        function deleteEvent(day, idx) {
            if(confirm("Delete this item?")) {
                events[day].splice(idx, 1);
                localStorage.setItem('march2026_events', JSON.stringify(events));
                initCalendar();
            }
        }

        function clearAllData() {
            if(confirm("Are you sure you want to clear the entire calendar for March?")) {
                events = {};
                localStorage.setItem('march2026_events', JSON.stringify(events));
                initCalendar();
            }
        }

        // The Email Generator
        function informMinoshSir() {
            let report = "CONTENT CALENDAR UPDATE - MARCH 2026\n\n";
            
            // Check if empty
            if(Object.keys(events).length === 0) {
                alert("The calendar is empty. Please add content first.");
                return;
            }

            // Loop through days
            for(let i=1; i<=totalDays; i++) {
                if(events[i] && events[i].length > 0) {
                    report += `📅 MARCH ${i}:\n`;
                    events[i].forEach((evt, idx) => {
                        const iconStr = evt.platforms.join('/');
                        // Convert 24h to 12h approximately for readability
                        report += `   ${idx+1}. [${evt.type}] ${evt.title}\n`;
                        report += `      Time: ${evt.time} | Platforms: ${iconStr}\n`;
                    });
                    report += "\n";
                }
            }
            
            // Copy to clipboard
            navigator.clipboard.writeText(report).then(() => {
                alert("Summary copied to clipboard! Opening email client...");
                window.location.href = `mailto:?subject=Content Calendar March 2026&body=${encodeURIComponent(report)}`;
            }, () => {
                alert("Could not copy text, but opening email client...");
                window.location.href = `mailto:?subject=Content Calendar March 2026&body=${encodeURIComponent(report)}`;
            });
        }

        // Start
        initCalendar();

        // Close modal on escape key
        document.onkeydown = function(evt) {
            evt = evt || window.event;
            var isEscape = false;
            if ("key" in evt) { isEscape = (evt.key === "Escape" || evt.key === "Esc"); }
            if (isEscape && document.body.classList.contains('modal-active')) {
                toggleModal();
            }
        };
    </script>
</body>
</html>
